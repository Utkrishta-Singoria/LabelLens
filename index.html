    <meta charset="UTF-8" />

    <meta name="description" content="LabelLens: AI-powered compliance checking and label verification system for packaged commodities under the Legal Metrology (Packaged Commodities) Rules, 2011 by the Ministry of Consumer Affairs (DoCA)." />

    <script>
      (function() {
        try {
          const theme = localStorage.getItem('labellens_theme') || localStorage.getItem('packcheck_theme') || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F2EA] text-[#332421] dark:bg-[#0A0C10] dark:text-slate-300 antialiased font-sans selection:bg-[#8E562E] selection:text-white transition-colors duration-150">
    <div id="root" class="min-h-screen bg-[#F7F2EA] text-[#332421] dark:bg-[#0A0C10] dark:text-slate-300"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
